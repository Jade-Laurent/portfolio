<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ゲームメンテナンス情報</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 24px 16px;
  }
  h1 {
    font-size: 13px;
    font-weight: 500;
    color: #888;
    letter-spacing: 0.08em;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .label {
    font-size: 12px;
    font-weight: 600;
    color: #555;
    padding: 0 4px;
  }
  .sub {
    font-size: 11px;
    color: #aaa;
    font-weight: 400;
  }
  .back-link {
    display: inline-block;
    font-size: 12px;
    color: #888;
    text-decoration: none;
    margin-bottom: 16px;
  }
  .back-link:hover { color: #555; }
</style>
</head>
<body>
